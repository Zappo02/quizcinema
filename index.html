<style>
/* Layout: una "sala" centrale stretta, biglietti come card di gioco, insegna art déco solo sul logo */
:root {
  --bg: #F6F3F2;
  --surface: #FFFFFF;
  --ink: #1B1420;
  --muted: #6D6170;
  --line: #E4DCE0;
  --velvet: #8E1B2E;
  --velvet-soft: #F4E3E6;
  --gold: #A9771A;
  --gold-soft: #F6EBD3;
  --ok: #1F7A4D;
  --ok-soft: #DDF1E5;
  --ko: #B3261E;
  --ko-soft: #F9E0DE;
  --f-display: "Limelight", "Georgia", serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #160D12; --surface: #221419; --ink: #F3EAE6; --muted: #B3A3A9; --line: #3A2730;
    --velvet: #E25D72; --velvet-soft: #3B1820; --gold: #E5B852; --gold-soft: #3A2C12;
    --ok: #5CC98D; --ok-soft: #173325; --ko: #F07A70; --ko-soft: #3D1A18; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #160D12; --surface: #221419; --ink: #F3EAE6; --muted: #B3A3A9; --line: #3A2730;
  --velvet: #E25D72; --velvet-soft: #3B1820; --gold: #E5B852; --gold-soft: #3A2C12;
  --ok: #5CC98D; --ok-soft: #173325; --ko: #F07A70; --ko-soft: #3D1A18; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: flex; flex-direction: column; gap: 20px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--f-display); font-size: 2rem; letter-spacing: .02em; color: var(--velvet); line-height: 1; background: none; border: 0; padding: 0; cursor: pointer; }
.logo small { display: block; font-family: var(--f-body); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 6px; font-weight: 600; }
.reel { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* home */
.intro { color: var(--muted); max-width: 60ch; margin: 0; }
.games { display: grid; gap: 14px; }
.ticket { display: grid; grid-template-columns: 76px 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; text-align: left; cursor: pointer; padding: 0; overflow: hidden; transition: transform .15s ease, border-color .15s ease; }
.ticket:hover { transform: translateY(-2px); border-color: var(--velvet); }
.stub { background: var(--velvet); color: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-right: 2px dashed var(--bg); font-family: var(--f-mono); }
.stub b { font-size: 1.5rem; line-height: 1; }
.stub span { font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; }
.ticket .body { padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ticket h2 { margin: 0; font-size: 1.2rem; text-wrap: balance; }
.ticket p { margin: 0; color: var(--muted); font-size: .92rem; }
.ticket .tag { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.foot { color: var(--muted); font-size: .8rem; }

/* game shell */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.back { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: .9rem; }
.back:hover { border-color: var(--velvet); }
.stats { display: flex; gap: 8px; font-family: var(--f-mono); font-size: .85rem; font-variant-numeric: tabular-nums; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
.chip.hot { background: var(--gold-soft); border-color: var(--gold); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.eyebrow { font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--velvet); font-weight: 700; }
.q { font-size: 1.35rem; font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.3; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 520px) { .opts { grid-template-columns: 1fr; } }
.opt { background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px; text-align: left; cursor: pointer; font-size: 1rem; min-width: 0; overflow-wrap: anywhere; }
.opt:hover:not(:disabled) { border-color: var(--velvet); }
.opt:disabled { cursor: default; }
.opt.right { background: var(--ok-soft); border-color: var(--ok); }
.opt.wrong { background: var(--ko-soft); border-color: var(--ko); }
.note { font-size: .95rem; color: var(--muted); margin: 0; }
.note b { color: var(--ink); }
.primary { background: var(--velvet); color: var(--bg); border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 700; cursor: pointer; align-self: flex-start; }
.primary:hover { filter: brightness(1.08); }
.ghost { background: none; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 18px; cursor: pointer; font-weight: 600; }
.ghost:hover { border-color: var(--velvet); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.progress { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--velvet); transition: width .3s ease; }
.timer i { background: var(--gold); transition: width 1s linear; }

/* indovina */
.clues { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.clue { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.clue .n { font-family: var(--f-mono); font-size: .8rem; color: var(--gold); font-weight: 600; padding-top: 2px; }
.clue .k { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: block; }
.clue.locked { opacity: .55; }
.clue .v { min-width: 0; overflow-wrap: anywhere; }
.guessbox { position: relative; }
.guessbox input { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
.sugg { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; max-height: 240px; overflow-y: auto; z-index: 5; margin: 0; padding: 4px; list-style: none; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
.sugg li button { width: 100%; text-align: left; background: none; border: 0; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
.sugg li button:hover, .sugg li button.act { background: var(--velvet-soft); }
.sugg small { color: var(--muted); font-family: var(--f-mono); }
.tries { display: flex; flex-wrap: wrap; gap: 6px; }
.tries span { font-size: .85rem; padding: 4px 10px; border-radius: 999px; background: var(--ko-soft); color: var(--ko); text-decoration: line-through; }
.reveal { display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 12px; }
.reveal.win { background: var(--ok-soft); }
.reveal.lose { background: var(--ko-soft); }
.reveal h3 { margin: 0; font-size: 1.25rem; }
.big { font-family: var(--f-mono); font-size: 2.6rem; font-weight: 600; color: var(--velvet); line-height: 1; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* hub e modalità */
.hub { display: flex; flex-direction: column; gap: 6px; }
.hub h1 { margin: 0; font-size: 1.7rem; text-wrap: balance; }
.lives { letter-spacing: 2px; }
.flash { font-size: .92rem; padding: 8px 12px; border-radius: 10px; }
.flash.win { background: var(--ok-soft); }
.flash.lose { background: var(--ko-soft); }
[hidden] { display: none !important; }
.sub { color: var(--muted); font-size: .9rem; margin: 0; }
.allgames { display: block; text-align: center; background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 700; padding: 14px 18px; border-radius: 12px; margin-top: 8px; }
.allgames:hover { filter: brightness(1.15); }
</style>
</head>

,"Q191074"],"x":["Q184255"]},{"n":"Shane Rimmer","f":["Q202211","Q208266","Q107761","Q107914","Q27204"],"x":["Q17738","Q166262","Q105702"]},{"n":"Bryce Dallas Howard","f":["Q182212","Q106428","Q3512046","Q191543","Q204374"],"x":["Q164103"]},{"n":"Vin Diesel","f":["Q155476","Q213208","Q401976","Q14650496","Q380996"],"x":["Q165817","Q5887360"]},{"n":"Christopher Lloyd","f":["Q91540","Q109331","Q230552","Q379873"],"x":["Q171669"]},{"n":"John Hurt","f":["Q102438","Q182373","Q103569","imdb-theelephantman1980"],"x":["Q5890","Q161678","Q232009"]},{"n":"Jeremy Renner","f":["Q182218","Q217020","Q183066","Q20382729"],"x":["Q23781155","Q14171368","Q18407657"]},{"n":"Gary Oldman","f":["Q102225","Q102448","Q484675","Q106506"],"x":["Q163872","Q102235","Q166262","Q108839994","Q232009","Q189330"]},{"n":"Geoffrey Rush","f":["Q160060","Q183555","Q46717","Q152456"],"x":["Q54274","Q161087","Q182944","Q10350033"]},{"n":"Irrfan Khan","f":["Q125076","Q152780","Q229808","Q3512046"],"x":[]},{"n":"Robert Pattinson","f":["Q102235","Q160071","Q61117344","Q116928"],"x":["Q102225","Q131547207"]},{"n":"Jennifer Connelly","f":["Q74958","Q164103","Q487181","imdb-topgunmaverick2022"],"x":["Q206388"]},{"n":"Ed Harris","f":["Q2579784","Q214801","Q106428","Q164103"],"x":[]},{"n":"Martin Sheen","f":["Q202211","Q229808","Q4254026","Q182692"],"x":["Q172975","Q208108"]},{"n":"Michael Fassbender","f":["Q131390","Q192686","Q4985891","Q3023357"],"x":["Q153723"]},{"n":"Javier Bardem","f":["Q4941","Q60834962","Q10350033","Q183081"],"x":[]},{"n":"Josh Brolin","f":["Q5887360","Q60834962","Q201687","Q183081"],"x":["Q23781155","Q23780914","Q14171368"]},{"n":"Kevin Spacey","f":["Q190908","Q25139","Q132351","imdb-laconfidential1997"],"x":[]},{"n":"Stanley Tucci","f":["Q275120","Q212965","Q318766","Q19946102"],"x":["Q18154496"]},{"n":"Gwyneth Paltrow","f":["Q23010088","Q205028","Q182944","Q209538"],"x":["Q182218","Q23781155","Q23780914","Q192724","Q190908"]},{"n":"Zendaya","f":["Q23010088","Q68934496","imdb-dunepartedue2024","imdb-spidermanbrandnewday2026"],"x":["Q27985819","Q60834962","Q131547207"]},{"n":"Andrew Garfield","f":["Q185888","Q229808","Q4254026","Q21010856"],"x":["Q68934496"]},{"n":"Woody Harrelson","f":["Q184605","Q212965","Q23006268","imdb-tremanifestiaebbingmisso2017"],"x":["Q183081"]},{"n":"Jim Carrey","f":["Q214801","Q219421","Q29906232","Q208269"],"x":[]},{"n":"Michael Stuhlbarg","f":["Q18406872","Q26698156","Q20382729","Q25136757"],"x":["Q206576","Q64211112"]},{"n":"Benicio del Toro","f":["Q5887360","Q1201853","Q192115","Q18486021"],"x":["Q23780914","Q132351"]},{"n":"Michael Shannon","f":["Q26698156","Q622769","Q14772351","Q488655"],"x":[]},{"n":"James Stewart","f":["Q34414","Q204191","Q202548","imdb-mrsmithvaawashington1939"],"x":[]},{"n":"John Turturro","f":["Q171453","Q61117344","Q232774","Q191100"],"x":["Q337078","Q220780"]}]}</script>
<script>
(() => {
const DB = JSON.parse(document.getElementById('data').textContent);
const FILMS = DB.films;
const FAMOUS = DB.famous;
const FBYID = Object.fromEntries(FILMS.map(f => [f.id, f]));
const app = document.getElementById('app');

/* ---------- utilità ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = Math.random;
const pick = a => a[Math.floor(rnd() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const fmtUSD = n => '$' + (n >= 1e9 ? (n / 1e9).toFixed(2).replace('.', ',') + ' mld' : Math.round(n / 1e6) + ' mln');
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const label = f => `${f.t} (${f.y})`;
const oscarCount = f => f.os.filter(o => o !== 'Oscar onorario' && o !== 'Oscar speciale').length;

/* pool di supporto */
const byDirector = {}; FILMS.forEach(f => f.r.forEach(r => (byDirector[r] = byDirector[r] || []).push(f)));
const byComposer = {}; FILMS.forEach(f => f.c.forEach(c => (byComposer[c] = byComposer[c] || []).push(f)));
const bySaga = {}; FILMS.forEach(f => f.s.forEach(s => (bySaga[s] = bySaga[s] || []).push(f)));
const DIRECTORS = Object.keys(byDirector).filter(d => byDirector[d].length >= 2);
const COMPOSERS = Object.keys(byComposer).filter(c => byComposer[c].length >= 2);
const SAGAS = Object.keys(bySaga).filter(s => bySaga[s].length >= 2 && !['Classici Disney', 'Rinascimento Disney'].includes(s));
const COUNTRIES = [...new Set(FILMS.flatMap(f => f.p))];
const STAR = new Set(FAMOUS.slice(0, 100));
const castSet = f => new Set([...f.a, ...f.fs, ...(f.stars || [])]);
const pop = f => f.votes || f.sl * 7000;
const fmt1 = n => n.toFixed(1).replace('.', ',');
/* livello di difficoltà: null = tutto il catalogo; 0..1 = solo la quota più popolare */
let LEVEL = null;
function pickF(arr) {
  if (LEVEL === null) return pick(arr);
  const s = arr.slice().sort((a, b) => pop(b) - pop(a));
  return pick(s.slice(0, Math.max(6, Math.ceil(s.length * LEVEL))));
}

function others(pool, exclude, n) {
  const out = []; for (const x of shuffle(pool)) { if (out.length === n) break; if (!exclude.has(x) && !out.includes(x)) out.push(x); } return out.length === n ? out : null;
}

/* ---------- generatori di domande ---------- */
const GEN = {
  regista() {
    const f = pickF(FILMS.filter(f => f.r.length === 1));
    const wrong = others(DIRECTORS, new Set(f.r), 3); if (!wrong) return null;
    return { cat: 'Regia', q: `Chi ha diretto «${f.t}»?`, ok: f.r[0], opts: [f.r[0], ...wrong], why: `«${f.t}» (${f.y}) è diretto da ${f.r[0]}.` };
  },
  anno() {
    const f = pickF(FILMS.filter(f => f.y && f.y <= 2025));
    const set = new Set([f.y]); while (set.size < 4) { const d = (Math.floor(rnd() * 8) + 2) * (rnd() < .5 ? -1 : 1); const y = f.y + d; if (y > 1900 && y <= 2025) set.add(y); }
    return { cat: 'Anno', q: `In che anno è uscito «${f.t}»?`, ok: String(f.y), opts: [...set].map(String), why: `«${f.t}» è del ${f.y}${f.r[0] ? ', regia di ' + f.r[0] : ''}.` };
  },
  attore() {
    const cand = FILMS.filter(f => f.a.some(a => STAR.has(a)));
    const f = pickF(cand); const ok = pick(f.a.filter(a => STAR.has(a)));
    const wrong = others([...STAR], castSet(f), 3); if (!wrong) return null;
    return { cat: 'Cast', q: `Quale di questi attori recita in «${f.t}»?`, ok, opts: [ok, ...wrong], why: `${ok} è nel cast di «${f.t}» (${f.y}).` };
  },
  compositore() {
    const f = pickF(FILMS.filter(f => f.c.length >= 1 && f.c.length <= 2 && f.c.some(c => COMPOSERS.includes(c))));
    const ok = f.c.find(c => COMPOSERS.includes(c));
    const wrong = others(COMPOSERS, new Set(f.c), 3); if (!wrong) return null;
    return { cat: 'Musica', q: `Chi ha firmato le musiche di «${f.t}»?`, ok, opts: [ok, ...wrong], why: `Le musiche di «${f.t}» sono di ${f.c.join(' e ')}.` };
  },
  filmDiRegista() {
    const d = pick(DIRECTORS); const f = pickF(byDirector[d]);
    const wrongF = shuffle(FILMS.filter(x => !x.r.includes(d))).slice(0, 3);
    return { cat: 'Regia', q: `Quale di questi film è stato diretto da ${d}?`, ok: label(f), opts: [label(f), ...wrongF.map(label)], why: `${d} ha diretto «${f.t}» (${f.y}).` };
  },
  saga() {
    const s = pick(SAGAS); const f = pickF(bySaga[s]);
    const wrongF = shuffle(FILMS.filter(x => !x.s.includes(s) && x.s.length)).slice(0, 3);
    return { cat: 'Saghe', q: `Quale di questi film fa parte della saga «${s}»?`, ok: label(f), opts: [label(f), ...wrongF.map(label)], why: `«${f.t}» appartiene a ${s}.` };
  },
  oscar() {
    const winners = FILMS.filter(f => oscarCount(f) >= 1);
    for (let tries = 0; tries < 40; tries++) {
      const four = shuffle(winners).slice(0, 4); const counts = four.map(oscarCount);
      const max = Math.max(...counts); if (counts.filter(c => c === max).length !== 1 || max < 3) continue;
      const top = four[counts.indexOf(max)];
      return { cat: 'Oscar', q: 'Quale di questi film ha vinto più premi Oscar?', ok: label(top), opts: four.map(label), why: four.map((f, i) => `«${f.t}» ${counts[i]}`).join(' · ') + ' (Oscar per categoria tecnica e attoriale).' };
    }
    return null;
  },
  paese() {
    const f = pickF(FILMS.filter(f => f.p.length === 1 && f.p[0] !== 'Stati Uniti'));
    const wrong = others(COUNTRIES, new Set(f.p), 3); if (!wrong) return null;
    return { cat: 'Origini', q: `Da quale paese arriva «${f.t}»?`, ok: f.p[0], opts: [f.p[0], ...wrong], why: `«${f.t}» (${f.y}) è una produzione ${f.p[0] === 'Regno Unito' ? 'del Regno Unito' : 'di ' + f.p[0]}.` };
  },
  imdb() {
    const rated = FILMS.filter(f => f.imdb && (LEVEL === null || f.votes > 300000));
    for (let tries = 0; tries < 40; tries++) {
      const four = shuffle(rated).slice(0, 4); const rs = four.map(f => f.imdb); const sorted = rs.slice().sort((a, b) => b - a);
      if (sorted[0] - sorted[1] < 0.2) continue;
      const top = four[rs.indexOf(sorted[0])];
      return { cat: 'Voto IMDb', q: 'Quale di questi film ha il voto più alto su IMDb?', ok: label(top), opts: four.map(label), why: four.map(f => `«${f.t}» ${fmt1(f.imdb)}`).join(' · ') };
    }
    return null;
  },
  durata() {
    for (let tries = 0; tries < 40; tries++) {
      const four = shuffle(FILMS.filter(f => f.m)).slice(0, 4); const ms = four.map(f => f.m);
      const max = Math.max(...ms); if (ms.filter(m => m === max).length !== 1) continue;
      const top = four[ms.indexOf(max)];
      return { cat: 'Durata', q: 'Quale di questi film è il più lungo?', ok: label(top), opts: four.map(label), why: four.map(f => `«${f.t}» ${f.m}′`).join(' · ') };
    }
    return null;
  }
};
function question(types) {
  for (let i = 0; i < 30; i++) { const q = GEN[pick(types)](); if (q) { q.opts = shuffle(q.opts); return q; } }
}

/* ---------- attori ---------- */
const NO_ACTOR = new Set(['Q16857406', 'Q27044293', 'Q36479', 'Q199839']); // film con sole voci: niente doppiatori
const ACTOR_DROP = new Set(['Shane Rimmer']);
const ACTORS = DB.actors.map(a => ({ n: a.n, f: a.f.filter(id => FBYID[id] && !NO_ACTOR.has(id)).map(id => FBYID[id]).sort((x, y) => pop(y) - pop(x)) }))
  .filter(a => a.f.length >= 4 && !ACTOR_DROP.has(a.n));
const ACTOR_SET = new Set(ACTORS.map(a => a.n));
const ALL_NAMES = [...new Set(FILMS.flatMap(f => [...f.a, ...f.fs, ...(f.stars || [])]).concat(ACTORS.map(a => a.n)))].sort();
const initials = n => n.split(/\s+/).filter(w => /^[A-ZÀ-Ý]/.test(w)).map(w => w[0] + '.').join(' ');
function actorClues(A) {
  const fl = A.f; const top = fl[0];
  // tre film dal meno noto al più noto, possibilmente di saghe diverse (niente tre 007 di fila)
  const sk = f => f.s[0] || norm(f.t).split(' ').slice(0, 2).join(' '); const used = new Set([sk(top)]); const rest = [];
  for (const f of fl.slice(1).reverse()) if (!used.has(sk(f))) { rest.push(f); used.add(sk(f)); }
  for (const f of fl.slice(1).reverse()) if (rest.length < 3 && !rest.includes(f)) rest.push(f);
  rest.splice(3); rest.sort((a, b) => pop(a) - pop(b));
  const film = f => `«${f.t}» (${f.y})`;
  const co = {}; fl.forEach(f => (f.stars && f.stars.length ? f.stars : f.a.slice(0, 4)).forEach(n => { if (n !== A.n) co[n] = (co[n] || 0) + 1; }));
  const best = Object.entries(co).sort((a, b) => b[1] - a[1])[0];
  const ys = fl.map(f => f.y); const span = `film tra il ${Math.min(...ys)} e il ${Math.max(...ys)}`;
  const c = [];
  c.push(['Ha recitato in', film(rest[0])]);
  c.push(['…e in', film(rest[1])]);
  c.push(['…e in', film(rest[2])]);
  c.push(['Carriera e colleghi', `${span}${best && best[1] >= 2 ? ` · ${best[1]} film con ${best[0]}` : ''}`]);
  c.push(['Il suo film più visto', film(top)]);
  c.push(['Iniziali', `${initials(A.n)} · ${fl.length} film da protagonista nel nostro archivio`]);
  return c;
}

/* ---------- Indovina il Film: indizi ---------- */
function todayKey() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
const dayLabel = k => k.split('-').reverse().join('/');
const FILM_POOL = FILMS.filter(f => !f.lite && f.r.length && f.g.length && f.p.length && (f.a.length >= 2 || f.s.length || f.c.length));
function clues(f) {
  const decade = Math.floor(f.y / 10) * 10;
  const c = [];
  c.push(['Genere e decennio', `${(f.g.slice(0, 3).join(', ') || 'film')} · anni ${decade >= 2000 ? decade : "'" + String(decade).slice(2)}`]);
  c.push(['Anno, durata, paese', `${f.y} · ${f.m ? f.m + ' minuti' : 'durata n.d.'} · ${f.p.join(', ')}`]);
  c.push(['Musiche e premi', `${f.c.length ? 'Musiche di ' + f.c.slice(0, 2).join(' e ') : 'Musiche non indicate'} · ${oscarCount(f) ? oscarCount(f) + ' Oscar vinti' : 'nessun Oscar vinto'}${f.imdb ? ' · voto IMDb ' + fmt1(f.imdb) : ''}`]);
  if (f.a.length >= 2) c.push([f.stars ? 'Protagonisti' : 'Alcuni attori del cast', f.a.slice(0, f.stars ? 3 : 4).join(', ')]);
  else c.push(['Produzione', (f.s.length ? 'Saga: ' + f.s[0] + ' · ' : '') + 'film d\'animazione o senza cast indicato']);
  c.push(['Regia', f.r.join(', ')]);
  const words = f.t.split(/\s+/).length;
  c.push(['Titolo', `Inizia per «${f.t[0]}» · ${words} ${words === 1 ? 'parola' : 'parole'} · titolo originale: ${f.o === f.t ? 'uguale a quello italiano' : 'diverso da quello italiano'}`]);
  return c;
}

/* ---------- configurazione dei giochi ---------- */
const byPop = (arr, val) => arr.slice().sort((a, b) => val(b) - val(a));
const FILM_SORTED = byPop(FILM_POOL, pop);
const ACTOR_SORTED = byPop(ACTORS, a => a.f.length * 1e6 + pop(a.f[0]));
const KINDS = {
  film: {
    title: 'Indovina il Film', noun: 'film', input: 'Scrivi il titolo italiano o originale…',
    pool: FILM_SORTED, dailyPool: FILM_SORTED.slice(0, 160),
    clues, key: f => f.id, name: f => `${f.t} (${f.y})`,
    sub: f => `${f.o !== f.t ? 'Titolo originale: ' + f.o + ' · ' : ''}regia di ${f.r.join(', ')}`,
    search(q) { return FILMS.filter(x => norm(x.t).includes(q) || norm(x.o).includes(q)).sort((a, b) => pop(b) - pop(a)).slice(0, 8).map(x => ({ key: x.id, label: x.t, small: x.y })); }
  },
  attore: {
    title: 'Indovina l\'Attore', noun: 'attore', input: 'Scrivi il nome dell\'attore o dell\'attrice…',
    pool: ACTOR_SORTED, dailyPool: ACTOR_SORTED.filter(a => a.f.length >= 5),
    clues: actorClues, key: a => a.n, name: a => a.n,
    sub: a => 'Tra i suoi film: ' + a.f.slice(0, 4).map(f => f.t).join(', '),
    search(q) {
      const hits = ALL_NAMES.filter(n => norm(n).includes(q));
      hits.sort((a, b) => (norm(b).startsWith(q) || norm(b).split(' ').some(w => w.startsWith(q))) - (norm(a).startsWith(q) || norm(a).split(' ').some(w => w.startsWith(q))) || ACTOR_SET.has(b) - ACTOR_SET.has(a));
      return hits.slice(0, 8).map(n => ({ key: n, label: n, small: '' }));
    }
  }
};
const MODES = {
  daily: { label: 'Giornaliera', num: '1', sub: 'al giorno' },
  tempo: { label: 'Sfida a tempo', num: '', sub: 'secondi' },
  sopr: { label: 'Sopravvivenza', num: '3', sub: 'vite' },
  libera: { label: 'Partita libera', num: '∞', sub: 'senza limiti' }
};
const TEMPO = { quiz: 60, film: 150, attore: 150 };
const GAME_TITLES = { quiz: 'Quiz Cinema', film: 'Indovina il Film', attore: 'Indovina l\'Attore' };

/* ---------- record e giornaliere ---------- */
const bestKey = (g, m) => `ciak2.best.${g}.${m}`;
function saveBest(g, m, v) { const b = store.get(bestKey(g, m), 0); if (v > b) store.set(bestKey(g, m), v); return { best: Math.max(b, v), record: v > b && v > 0 }; }
const dailyKey = g => `ciak2.daily.${g}`;
function getDaily(g) { return store.get(dailyKey(g), {}); }
function setDaily(g, res) {
  const today = todayKey(); const prev = getDaily(g);
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yKey = `${y.getFullYear()}-${String(y.getMonth() + 1).padStart(2, '0')}-${String(y.getDate()).padStart(2, '0')}`;
  const streak = res.win ? (prev.day === yKey && prev.win ? (prev.streak || 0) + 1 : 1) : 0;
  const rec = { ...res, day: today, streak };
  store.set(dailyKey(g), rec); return rec;
}
function seedFor(tag) { let s = 0; for (const ch of todayKey() + tag) s = s * 31 + ch.charCodeAt(0) | 0; return s; }
function shareBtn(text) {
  const b = h(`<button class="ghost" type="button">Copia risultato</button>`);
  b.onclick = async () => { try { await navigator.clipboard.writeText(text); b.textContent = 'Copiato'; } catch (e) { b.textContent = 'Copia non disponibile'; } };
  return b;
}

/* ---------- shell ---------- */
let tick = null;
function stopTimer() { if (tick) { clearInterval(tick); tick = null; } }
function header() {
  const el = h(`<header class="top"><button class="logo" type="button">Ciak<small>Giochi di cinema</small></button><span class="reel">${FILMS.length} film · ${ACTORS.length} attori</span></header>`);
  el.querySelector('.logo').onclick = () => { stopTimer(); home(); }; return el;
}
function ticket(num, sub, title, desc, fn, tag) {
  const b = h(`<button class="ticket" type="button"><span class="stub"><b>${esc(num)}</b><span>${esc(sub)}</span></span><span class="body">${tag ? `<span class="tag">${esc(tag)}</span>` : ''}<h2>${esc(title)}</h2><p>${esc(desc)}</p></span></button>`);
  b.onclick = fn; return b;
}
function bar(statsHtml, backTo) {
  const el = h(`<div class="bar"><button class="back" type="button">← ${backTo ? GAME_TITLES[backTo] : 'Menu Ciak'}</button><div class="stats">${statsHtml}</div></div>`);
  el.querySelector('.back').onclick = () => { stopTimer(); backTo ? hub(backTo) : home(); }; return el;
}
const hearts = n => `<span class="chip lives" aria-label="${n} vite">${'♥'.repeat(n)}${'♡'.repeat(3 - n)}</span>`;
function endCard(g, m, score, unit, extra) {
  const { best, record } = saveBest(g, m, score);
  const c = h(`<section class="card"><span class="eyebrow">${m === 'tempo' ? 'Tempo scaduto' : 'Fine della corsa'} · ${esc(MODES[m].label)}</span><div class="big">${score}</div><p class="sub">${esc(unit)}</p><h2 class="q">${record ? 'Nuovo record personale.' : `Record da battere: ${best}.`}</h2>${extra || ''}<div class="row"><button class="primary" type="button">Rigioca</button><button class="ghost" type="button">Altre modalità</button></div></section>`);
  const [again, back] = c.querySelectorAll('.row button'); again.onclick = () => play(g, m); back.onclick = () => hub(g);
  app.replaceChildren(header(), bar('', g), c); again.focus();
}

/* ---------- home e hub ---------- */
function home() {
  rnd = Math.random; LEVEL = null; stopTimer();
  const today = todayKey();
  const status = g => { const d = getDaily(g); return d.day === today ? 'Giornaliera fatta' : 'Giornaliera da giocare'; };
  app.replaceChildren(
    header(),
    h(`<p class="intro">Tre giochi sui ${FILMS.length} film più famosi di sempre, ognuno con sfida giornaliera, a tempo e sopravvivenza.</p>`),
    (() => {
      const g = h(`<div class="games"></div>`);
      g.append(
        ticket('Q', 'domande', 'Quiz Cinema', 'Registi, anni, cast, musiche, saghe, Oscar e voti IMDb. Quattro risposte, una giusta.', () => hub('quiz'), status('quiz')),
        ticket('?', '6 indizi', 'Indovina il Film', 'Un indizio alla volta: genere, anno, musiche, cast, regista, titolo.', () => hub('film'), status('film')),
        ticket('★', '6 indizi', 'Indovina l\'Attore', `Ti diamo i film in cui ha recitato, dal meno noto al più famoso. ${ACTORS.length} attori e attrici da scoprire.`, () => hub('attore'), status('attore'))
      );
      return g;
    })(),
    h(`<p class="foot">Dati da Wikidata e IMDb, puliti a mano. Oscar conteggiati per categoria. I record restano salvati su questo dispositivo.</p>`)
  );
}
const HUB_TEXT = {
  quiz: { daily: 'Le stesse 10 domande per tutti, una volta al giorno.', tempo: '60 secondi. Ogni errore ne costa 3.', sopr: 'Domande sempre più difficili. Tre errori e sei fuori.', libera: '10 domande a caso, quante partite vuoi.' },
  film: { daily: 'Il film del giorno: sei indizi per arrivarci.', tempo: '150 secondi per indovinare più film possibile. Meno indizi usi, più punti fai.', sopr: 'Film sempre meno famosi. Ogni film mancato costa una vita.', libera: 'Un film a caso, senza fretta.' },
  attore: { daily: 'L\'attore del giorno: sei indizi per riconoscerlo.', tempo: '150 secondi per riconoscere più attori possibile.', sopr: 'Attori sempre meno ovvi. Ogni attore mancato costa una vita.', libera: 'Un attore a caso, senza fretta.' }
};
function hub(g) {
  rnd = Math.random; LEVEL = null; stopTimer();
  const today = todayKey(); const d = getDaily(g); const doneToday = d.day === today;
  const dailyDesc = doneToday
    ? (g === 'quiz' ? `Fatta oggi: ${d.score}/10.` : d.win ? `Risolta oggi con ${d.used} ${d.used === 1 ? 'indizio' : 'indizi'}.` : 'Oggi è andata male: riprova domani.') + (d.streak > 1 ? ` Serie di ${d.streak} giorni.` : '')
    : HUB_TEXT[g].daily;
  const bestTxt = m => { const b = store.get(bestKey(g, m), 0); return b ? ` Record: ${b}.` : ''; };
  const list = h(`<div class="games"></div>`);
  list.append(
    ticket('1', 'al giorno', MODES.daily.label, dailyDesc, () => play(g, 'daily'), doneToday ? 'Fatta · ' + dayLabel(today) : 'Nuova · ' + dayLabel(today)),
    ticket(String(TEMPO[g]), 'secondi', MODES.tempo.label, HUB_TEXT[g].tempo + bestTxt('tempo'), () => play(g, 'tempo')),
    ticket('3', 'vite', MODES.sopr.label, HUB_TEXT[g].sopr + bestTxt('sopr'), () => play(g, 'sopr')),
    ticket('∞', 'libera', MODES.libera.label, HUB_TEXT[g].libera, () => play(g, 'libera'))
  );
  app.replaceChildren(header(), bar(''), h(`<div class="hub"><span class="eyebrow">Scegli la modalità</span><h1>${esc(GAME_TITLES[g])}</h1></div>`), list);
}
function play(g, m) { stopTimer(); rnd = Math.random; LEVEL = null; g === 'quiz' ? runQuiz(m) : runGuess(g, m); }

/* ---------- Quiz in tutte le modalità ---------- */
const QTYPES = ['regista', 'anno', 'attore', 'compositore', 'filmDiRegista', 'saga', 'oscar', 'paese', 'durata', 'imdb'];
const QFAST = ['regista', 'anno', 'attore', 'filmDiRegista', 'saga', 'compositore'];
function runQuiz(mode) {
  const today = todayKey();
  if (mode === 'daily' && getDaily('quiz').day === today) return dailyDone('quiz');
  let qs = null;
  if (mode === 'daily' || mode === 'libera') {
    if (mode === 'daily') { rnd = mulberry(seedFor('quiz')); LEVEL = 0.5; }
    const order = shuffle([...QTYPES]).slice(0, 10);
    qs = order.map(t => question([t]));
    rnd = Math.random; LEVEL = null;
  }
  const total = qs ? 10 : Infinity;
  let i = 0, score = 0, lives = 3, streak = 0, left = TEMPO.quiz, over = false;
  const statsHtml = () => mode === 'tempo' ? `<span class="chip ${left <= 10 ? 'hot' : ''}">${left}s</span><span class="chip">Giuste ${score}</span>${streak >= 3 ? `<span class="chip hot">Serie ${streak}</span>` : ''}`
    : mode === 'sopr' ? `${hearts(lives)}<span class="chip">Giuste ${score}</span>` : `<span class="chip">Punti ${score}/10</span>`;
  const card = h(`<section class="card">${mode === 'tempo' ? '<div class="progress timer"><i style="width:100%"></i></div>' : qs ? '<div class="progress"><i></i></div>' : ''}<span class="eyebrow" id="cat"></span><h2 class="q" id="qq"></h2><div class="opts"></div><div id="after"></div></section>`);
  const opts = card.querySelector('.opts'), qq = card.querySelector('#qq'), cat = card.querySelector('#cat'), after = card.querySelector('#after');
  const prog = card.querySelector('.progress i');
  const stats = () => { const s = app.querySelector('.stats'); if (s) s.innerHTML = statsHtml(); };
  const next = () => {
    if (mode === 'sopr') LEVEL = Math.min(1, 0.2 + i * 0.06);
    const q = qs ? qs[i] : question(mode === 'tempo' ? QFAST : QTYPES);
    LEVEL = null;
    cat.textContent = qs ? `Domanda ${i + 1} di 10 · ${q.cat}` : mode === 'sopr' ? `Domanda ${i + 1} · ${q.cat}` : q.cat;
    qq.textContent = q.q; after.replaceChildren();
    if (qs) prog.style.width = (i * 10) + '%';
    opts.replaceChildren(...q.opts.map(o => {
      const b = h(`<button class="opt" type="button">${esc(o)}</button>`);
      b.onclick = () => {
        if (over) return;
        const right = o === q.ok;
        opts.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.textContent === q.ok) x.classList.add('right'); });
        if (right) { score++; streak++; } else { b.classList.add('wrong'); streak = 0; }
        i++;
        if (mode === 'tempo') {
          if (!right) { left = Math.max(0, left - 3); card.querySelector('.timer i').style.width = (left / TEMPO.quiz * 100) + '%'; }
          stats(); setTimeout(() => { if (!over) next(); }, right ? 350 : 900); return;
        }
        if (mode === 'sopr' && !right) lives--;
        stats();
        const last = qs ? i >= total : lives <= 0;
        if (mode === 'sopr' && right) { setTimeout(() => { if (!over) next(); }, 650); return; }
        after.replaceChildren(h(`<p class="note"><b>${right ? 'Esatto.' : 'Sbagliato.'}</b> ${esc(q.why)}</p>`));
        const nb = h(`<button class="primary" type="button" style="margin-top:12px">${last ? 'Vedi il risultato' : 'Prossima domanda'}</button>`);
        nb.onclick = () => last ? end() : next();
        after.append(nb); nb.focus();
      };
      return b;
    }));
  };
  const end = () => {
    over = true; stopTimer();
    if (mode === 'tempo' || mode === 'sopr') return endCard('quiz', mode, score, 'risposte giuste');
    const verdict = score >= 9 ? 'Da Oscar alla carriera.' : score >= 7 ? 'Cinefilo vero.' : score >= 5 ? 'Spettatore attento.' : 'Serve una maratona di classici.';
    let rec = null; if (mode === 'daily') rec = setDaily('quiz', { score, win: score >= 6 });
    const c = h(`<section class="card"><span class="eyebrow">${mode === 'daily' ? 'Quiz del giorno · ' + dayLabel(today) : 'Risultato'}</span><div class="big">${score}/10</div><h2 class="q">${verdict}</h2>${rec && rec.streak > 1 ? `<p class="sub">Serie di ${rec.streak} giorni con almeno 6 risposte giuste.</p>` : ''}<div class="row"></div></section>`);
    const row = c.querySelector('.row');
    if (mode === 'daily') row.append(shareBtn(`Ciak · Quiz del giorno ${dayLabel(today)}: ${score}/10 🎬`));
    const again = h(`<button class="primary" type="button">${mode === 'daily' ? 'Partita libera' : 'Nuovo quiz'}</button>`); again.onclick = () => play('quiz', 'libera');
    const back = h(`<button class="ghost" type="button">Altre modalità</button>`); back.onclick = () => hub('quiz');
    row.prepend(again); row.append(back);
    app.replaceChildren(header(), bar('', 'quiz'), c);
  };
  app.replaceChildren(header(), bar(statsHtml(), 'quiz'), card); next();
  if (mode === 'tempo') tick = setInterval(() => { left--; card.querySelector('.timer i').style.width = (Math.max(left, 0) / TEMPO.quiz * 100) + '%'; if (left <= 0) end(); else stats(); }, 1000);
}
function dailyDone(g) {
  const d = getDaily(g); const today = todayKey();
  const res = g === 'quiz' ? `${d.score}/10` : d.win ? `${d.used}/6 indizi` : 'non indovinato';
  const c = h(`<section class="card"><span class="eyebrow">${esc(GAME_TITLES[g])} · ${dayLabel(today)}</span><div class="big">${esc(res)}</div>${d.answer ? `<p class="sub">Soluzione: <b>${esc(d.answer)}</b></p>` : ''}<h2 class="q">La giornaliera di oggi è già fatta. Torna domani per la prossima.</h2>${d.streak > 1 ? `<p class="sub">Serie di ${d.streak} giorni.</p>` : ''}<div class="row"><button class="primary" type="button">Partita libera</button></div></section>`);
  c.querySelector('.primary').onclick = () => play(g, 'libera');
  c.querySelector('.row').append(shareBtn(`Ciak · ${GAME_TITLES[g]} ${dayLabel(today)}: ${res} 🎬`));
  app.replaceChildren(header(), bar('', g), c);
}

/* ---------- Indovina il Film / l'Attore in tutte le modalità ---------- */
function runGuess(g, mode) {
  const K = KINDS[g]; const today = todayKey();
  if (mode === 'daily' && getDaily(g).day === today) return dailyDone(g);
  let target, C, shown, wrong, usedClues, round = 0, score = 0, solved = 0, lives = 3, left = TEMPO[g], over = false, roundOver = false;
  const seen = new Set();
  const choose = () => {
    if (mode === 'daily') { rnd = mulberry(seedFor(g)); const t = pick(K.dailyPool); rnd = Math.random; return t; }
    let pool = K.pool;
    if (mode === 'sopr') pool = pool.slice(0, Math.max(12, Math.ceil(pool.length * Math.min(1, 0.15 + round * 0.07))));
    if (mode === 'tempo') pool = pool.slice(0, Math.ceil(pool.length * 0.6));
    const fresh = pool.filter(x => !seen.has(K.key(x)));
    return pick(fresh.length ? fresh : pool);
  };
  const multi = mode === 'tempo' || mode === 'sopr';
  const eyebrow = () => mode === 'daily' ? `${g === 'film' ? 'Film' : 'Attore'} del giorno · ${dayLabel(today)}` : mode === 'libera' ? 'Partita libera' : `${MODES[mode].label} · ${g === 'film' ? 'film' : 'attore'} n. ${round + 1}`;
  const statsHtml = () => mode === 'tempo' ? `<span class="chip ${left <= 15 ? 'hot' : ''}">${left}s</span><span class="chip">Punti ${score}</span>`
    : mode === 'sopr' ? `${hearts(lives)}<span class="chip">Indovinati ${solved}</span>` : '';
  const card = h(`<section class="card">${mode === 'tempo' ? '<div class="progress timer"><i style="width:100%"></i></div>' : ''}<div class="row" style="justify-content:space-between;align-items:center"><span class="eyebrow" id="eb"></span><span class="pill" id="pts"></span></div><div id="flash"></div><ol class="clues"></ol><div class="tries"></div><div class="guessbox"><label for="g-in" class="eyebrow" style="display:block;margin-bottom:6px">Il tuo tentativo</label><input id="g-in" autocomplete="off" placeholder="${esc(K.input)}"><ul class="sugg" hidden></ul></div><div class="row" id="ctl"><button class="ghost" type="button" id="skip">Prossimo indizio</button>${multi ? '<button class="ghost" type="button" id="pass">Passa</button>' : ''}</div><div id="out"></div></section>`);
  const $ = s => card.querySelector(s);
  const list = $('.clues'), tries = $('.tries'), input = $('#g-in'), sugg = $('.sugg'), out = $('#out'), skip = $('#skip'), pts = $('#pts'), eb = $('#eb'), flash = $('#flash'), pass = $('#pass');
  const stats = () => { const s = app.querySelector('.stats'); if (s) s.innerHTML = statsHtml(); };
  const draw = () => {
    eb.textContent = eyebrow();
    list.replaceChildren(...C.map((c, k) => k < shown
      ? h(`<li class="clue"><span class="n">${k + 1}/6</span><span class="v"><span class="k">${esc(c[0])}</span>${esc(c[1])}</span></li>`)
      : h(`<li class="clue locked"><span class="n">${k + 1}/6</span><span class="v"><span class="k">${esc(c[0])}</span>Indizio bloccato</span></li>`)));
    tries.replaceChildren(...wrong.map(w => h(`<span>${esc(w)}</span>`)));
    pts.textContent = roundOver ? '' : `In palio ${7 - shown} ${7 - shown === 1 ? 'punto' : 'punti'}`; pts.hidden = roundOver;
  };
  const startRound = () => {
    target = choose(); seen.add(K.key(target)); C = K.clues(target);
    shown = 1; usedClues = 1; wrong = []; roundOver = false;
    input.disabled = false; input.value = ''; skip.hidden = false; if (pass) pass.hidden = false;
    draw(); input.focus();
  };
  const endRound = (won) => {
    if (over) return;
    roundOver = true;
    if (!multi) {
      shown = 6; input.disabled = true; sugg.hidden = true; skip.hidden = true; draw();
      out.replaceChildren(h(`<div class="reveal ${won ? 'win' : 'lose'}"><span class="eyebrow">${won ? `Indovinato con ${usedClues} ${usedClues === 1 ? 'indizio' : 'indizi'}` : 'La risposta era'}</span><h3>${esc(K.name(target))}</h3><span class="note">${esc(K.sub(target))}</span></div>`));
      const row = h(`<div class="row" style="margin-top:12px"></div>`);
      if (mode === 'daily') {
        const rec = setDaily(g, { win: won, used: usedClues, answer: K.name(target) });
        if (rec.streak > 1) out.append(h(`<p class="sub" style="margin-top:8px">Serie di ${rec.streak} giorni.</p>`));
        row.append(shareBtn(`Ciak · ${K.title} ${dayLabel(today)}: ${won ? usedClues + '/6' : 'X/6'} ${'🟥'.repeat(won ? usedClues - 1 : 6)}${won ? '🟩' : ''}`));
      }
      const again = h(`<button class="primary" type="button">${mode === 'daily' ? 'Partita libera' : 'Un altro'}</button>`); again.onclick = () => play(g, 'libera');
      const back = h(`<button class="ghost" type="button">Altre modalità</button>`); back.onclick = () => hub(g);
      row.prepend(again); row.append(back); out.append(row);
      return;
    }
    if (won) { const p = 7 - usedClues; score += p; solved++; flash.replaceChildren(h(`<div class="flash win"><b>Sì, ${esc(K.name(target))}.</b> +${p} punti</div>`)); }
    else { if (mode === 'sopr') lives--; flash.replaceChildren(h(`<div class="flash lose">Era <b>${esc(K.name(target))}</b>.</div>`)); }
    stats(); round++;
    if (mode === 'sopr' && lives <= 0) return finishRun();
    startRound();
  };
  const finishRun = () => {
    over = true; stopTimer();
    endCard(g, mode, mode === 'tempo' ? score : solved, mode === 'tempo' ? `punti · ${solved} ${g === 'film' ? 'film indovinati' : 'attori indovinati'}` : (g === 'film' ? 'film indovinati' : 'attori indovinati'));
  };
  const advance = (lbl) => {
    if (lbl) wrong.push(lbl);
    if (shown >= 6) { endRound(false); return; }
    shown++; usedClues = shown; draw();
  };
  const attempt = (item) => {
    input.value = ''; sugg.hidden = true;
    if (item.key === K.key(target)) { usedClues = shown; endRound(true); } else advance(item.label);
    if (!over) input.focus();
  };
  let act = -1, matches = [];
  input.oninput = () => {
    const q = norm(input.value); act = -1;
    if (q.length < 2) { sugg.hidden = true; return; }
    matches = K.search(q);
    sugg.replaceChildren(...matches.map(m => { const li = h(`<li><button type="button">${esc(m.label)} <small>${esc(m.small)}</small></button></li>`); li.firstChild.onclick = () => attempt(m); return li; }));
    sugg.hidden = !matches.length;
  };
  input.onkeydown = (e) => {
    const btns = [...sugg.querySelectorAll('button')]; if (sugg.hidden || !btns.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); act = (act + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length; btns.forEach((b, k) => b.classList.toggle('act', k === act)); }
    if (e.key === 'Enter') { e.preventDefault(); attempt(matches[act >= 0 ? act : 0]); }
    if (e.key === 'Escape') sugg.hidden = true;
  };
  skip.onclick = () => advance(null);
  if (pass) pass.onclick = () => endRound(false);
  app.replaceChildren(header(), bar(statsHtml(), g), card);
  startRound();
  if (mode === 'tempo') tick = setInterval(() => { left--; $('.timer i').style.width = (Math.max(left, 0) / TEMPO[g] * 100) + '%'; if (left <= 0) finishRun(); else stats(); }, 1000);
}

home();

/* altezza della pagina al sito che incorpora l'iframe */
let lastH = 0;
const sendHeight = () => { const hh = Math.ceil(Math.max(document.body.scrollHeight, document.body.getBoundingClientRect().height)); if (hh !== lastH) { lastH = hh; try { parent.postMessage({ type: 'ciak-height', height: hh }, '*'); } catch (e) {} } };
try { new ResizeObserver(sendHeight).observe(document.body); } catch (e) { setInterval(sendHeight, 500); }
new MutationObserver(sendHeight).observe(app, { childList: true, subtree: true });
window.addEventListener('load', sendHeight);
/* a ogni cambio schermata riporta in alto il gioco */
new MutationObserver(() => { try { parent.postMessage({ type: 'ciak-top' }, '*'); } catch (e) {} }).observe(app, { childList: true });
})();
</script>
</body>
</html>
